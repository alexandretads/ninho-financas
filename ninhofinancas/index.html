<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b100d" />
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("ninho:tema") || localStorage.getItem("prumo:tema") || localStorage.getItem("norte:tema");
          if (tema === "light" || tema === "dark") {
            document.documentElement.dataset.theme = tema;
            document.documentElement.style.colorScheme = tema;
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Ninho é o espaço de finanças do casal: login compartilhado, plano do mês, metas, crédito, comissões e assinatura segura. Funciona offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ninho" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Ninho — Finanças na palma da mão</title>
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
